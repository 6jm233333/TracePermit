name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/verify_release.py
      - run: python scripts/summarize_results.py
      - run: python -m unittest discover -s tests -v
